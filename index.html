<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADELUUVE | Administración</title>
  <meta name="theme-color" content="#063f5c" />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <main class="admin-root">
    <section class="login-screen" id="login-screen">
      <div class="login-card">
        <img src="../assets/logo.png" alt="ADELUUVE" />
        <span>Administración</span>
        <h1>Acceso</h1>
        <form id="login-form">
          <label>Correo<input id="login-email" type="email" required autocomplete="email" /></label>
          <label>Contraseña<input id="login-password" type="password" required autocomplete="current-password" /></label>
          <button type="submit">Ingresar</button>
          <p id="login-status" role="status"></p>
        </form>
      </div>
    </section>

    <section class="admin-shell hidden" id="admin-shell">
      <aside class="sidebar">
        <a class="admin-brand" href="../index.html"><img src="../assets/logo.png" alt="ADELUUVE" /></a>
        <nav>
          <button class="side-link active" data-view="dashboard">Resumen</button>
          <button class="side-link" data-view="proyectos">Proyectos</button>
          <button class="side-link" data-view="contactos">Solicitudes</button>
        </nav>
        <button id="logout-btn" class="logout-btn">Cerrar sesión</button>
      </aside>

      <div class="admin-main">
        <header class="admin-topbar">
          <div><span>ADELUUVE</span><h1 id="view-title">Resumen</h1></div>
          <div class="top-actions"><a href="../index.html" target="_blank" rel="noopener">Ver sitio ↗</a><span id="admin-email"></span></div>
        </header>

        <section class="view active" id="view-dashboard">
          <div class="metric-grid">
            <article><span>Solicitudes nuevas</span><b id="metric-new">—</b></article>
            <article><span>En seguimiento</span><b id="metric-follow">—</b></article>
            <article><span>Finalizadas</span><b id="metric-done">—</b></article>
            <article><span>Proyectos publicados</span><b id="metric-projects">—</b></article>
          </div>
          <div class="panel"><div class="panel-head"><div><span>Últimas solicitudes</span><h2>Actividad reciente</h2></div></div><div id="recent-contacts" class="mini-list"></div></div>
        </section>

        <section class="view" id="view-proyectos">
          <div class="panel">
            <div class="panel-head"><div><span>Portafolio</span><h2>Proyectos y trabajos</h2></div><button id="new-project-btn" class="primary-btn">+ Nueva publicación</button></div>
            <div id="admin-projects" class="admin-projects"></div>
          </div>
        </section>

        <section class="view" id="view-contactos">
          <div class="panel">
            <div class="panel-head"><div><span>Contacto</span><h2>Solicitudes recibidas</h2></div><select id="contact-filter"><option value="todos">Todos</option><option value="Nuevo">Nuevo</option><option value="Contactado">Contactado</option><option value="En seguimiento">En seguimiento</option><option value="Cotización">Cotización</option><option value="Finalizado">Finalizado</option></select></div>
            <div id="admin-contacts" class="contact-list"></div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div class="drawer" id="project-drawer" aria-hidden="true">
    <div class="drawer-card">
      <button class="drawer-close" id="project-drawer-close">×</button>
      <span class="drawer-kicker">Publicación</span><h2 id="project-form-title">Nueva publicación</h2>
      <form id="project-form">
        <input type="hidden" id="project-id" />
        <label>Título *<input id="project-title" required maxlength="180" /></label>
        <label>Tipo<select id="project-type"><option value="Proyecto">Proyecto</option><option value="Trabajo">Trabajo</option></select></label>
        <label>Descripción<textarea id="project-description" rows="6" maxlength="4000"></textarea></label>
        <label class="check-row"><input id="project-published" type="checkbox" checked /> Publicado</label>
        <label>Agregar imágenes<input id="project-images" type="file" accept="image/*" multiple /></label>
        <div id="existing-images" class="existing-images"></div>
        <button class="primary-btn" id="save-project-btn" type="submit">Guardar publicación</button>
        <p id="project-form-status" role="status"></p>
      </form>
    </div>
  </div>

  <div class="drawer" id="contact-drawer" aria-hidden="true">
    <div class="drawer-card">
      <button class="drawer-close" id="contact-drawer-close">×</button>
      <span class="drawer-kicker">Solicitud</span><h2 id="contact-detail-name">—</h2>
      <div id="contact-detail" class="contact-detail"></div>
      <label>Estatus<select id="contact-status"><option>Nuevo</option><option>Contactado</option><option>En seguimiento</option><option>Cotización</option><option>Finalizado</option></select></label>
      <button class="primary-btn" id="save-contact-status">Guardar estatus</button>
      <p id="contact-detail-status" role="status"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
